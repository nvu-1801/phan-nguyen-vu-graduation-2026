services:
  invitation:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.production
    environment:
      DATABASE_URL: file:/app/data/graduation.db
      TRUST_PROXY: "1"
    volumes:
      - graduation-data:/app/data
volumes:
  graduation-data:
