services:
  invitation:
    image: graduation-2026:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_ORIGIN:-http://localhost:3000}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: file:/app/data/graduation.db
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:?Set RATE_LIMIT_SECRET in the selected env file}
      SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN in the selected env file}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - graduation-data:/app/data
volumes:
  graduation-data:
