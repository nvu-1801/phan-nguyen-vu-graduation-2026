name: Graduation CI

on:
  push:
    branches: [preview/graduation-2026, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run docker:local
      - run: npm run docker:smoke
      - name: Stop local production smoke environment
        if: always() && hashFiles('.env.docker.local') != ''
        run: docker compose --env-file .env.docker.local -p graduation-local down
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: graduation-browser-results
          path: |
            playwright-report/
            test-results/**/*.png
            public/images/manifest.json
            test-results/docker/report.json
          if-no-files-found: ignore
